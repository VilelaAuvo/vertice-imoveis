<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vértice Imóveis — Clientes</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--gold:#C9973A;--gold-light:#E8C070;--black:#080808;--surface:#111111;--surface2:#181818;--surface3:#141414;--border:rgba(201,151,58,0.15);--border-h:rgba(201,151,58,0.35);--text:#E8E0D0;--text-muted:#7A7060;--green:#5a9a20;--green-bg:rgba(90,154,32,0.12);--amber:#e8a030;--amber-bg:rgba(232,160,48,0.12);--red:#e05050;--red-bg:rgba(224,80,80,0.12);--blue:#4a9edd;--blue-bg:rgba(74,158,221,0.12);--sidebar-w:200px;}
    html,body{height:100%;background:var(--black);font-family:'Jost',sans-serif;color:var(--text);}
    body::before{content:'';position:fixed;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(201,151,58,0.03) 60px),repeating-linear-gradient(90deg,transparent,transparent 59px,rgba(201,151,58,0.03) 60px);pointer-events:none;z-index:0;}
    .topbar{position:fixed;top:0;left:0;right:0;height:56px;background:var(--surface);border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100;}
    .topbar::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
    .logo-area{display:flex;align-items:center;gap:12px;}
    .logo-name{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;letter-spacing:4px;color:#fff;}
    .logo-sub{font-size:8px;font-weight:300;letter-spacing:4px;color:var(--gold);text-transform:uppercase;margin-top:2px;}
    .topbar-right{display:flex;align-items:center;gap:16px;}
    .user-name{font-size:13px;color:var(--text);}.user-role{font-size:10px;font-weight:300;letter-spacing:1px;color:var(--text-muted);}
    .avatar{width:34px;height:34px;border-radius:50%;background:rgba(201,151,58,0.15);border:0.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--gold);}
    .btn-sair{font-size:10px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;background:none;border:0.5px solid var(--border);border-radius:2px;padding:6px 12px;cursor:pointer;transition:all 0.2s;}
    .btn-sair:hover{color:var(--gold);border-color:var(--border-h);}
    .sidebar{position:fixed;top:56px;left:0;bottom:0;width:var(--sidebar-w);background:var(--surface);border-right:0.5px solid var(--border);padding:24px 0;z-index:90;overflow-y:auto;}
    .nav-section{font-size:9px;font-weight:500;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;padding:0 20px;margin:20px 0 8px;}
    .nav-section:first-child{margin-top:0;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:12px;color:var(--text-muted);cursor:pointer;transition:all 0.2s;border-left:2px solid transparent;text-decoration:none;}
    .nav-item:hover{color:var(--text);background:rgba(201,151,58,0.05);}
    .nav-item.active{color:var(--gold);border-left-color:var(--gold);background:rgba(201,151,58,0.08);}
    .main{margin-left:var(--sidebar-w);margin-top:56px;padding:28px;position:relative;z-index:1;}
    .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
    .page-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;color:#fff;letter-spacing:2px;}
    .btn-novo{background:var(--gold);color:#080808;border:none;border-radius:2px;padding:10px 20px;font-family:'Jost',sans-serif;font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:background 0.2s;}
    .btn-novo:hover{background:var(--gold-light);}
    .filtros{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
    .search-wrap{flex:1;min-width:200px;}
    .search-wrap input{width:100%;background:var(--surface3);border:0.5px solid var(--border);border-radius:2px;padding:10px 14px;font-family:'Jost',sans-serif;font-size:13px;font-weight:300;color:var(--text);outline:none;transition:border-color 0.2s;}
    .search-wrap input:focus{border-color:var(--border-h);}
    .search-wrap input::placeholder{color:var(--text-muted);}
    .filter-select{background:var(--surface3);border:0.5px solid var(--border);border-radius:2px;padding:10px 14px;font-family:'Jost',sans-serif;font-size:12px;color:var(--text-muted);outline:none;cursor:pointer;}
    .card{background:var(--surface3);border:0.5px solid var(--border);border-radius:4px;overflow:hidden;}
    table{width:100%;border-collapse:collapse;}
    th{font-size:9px;font-weight:500;letter-spacing:1.5px;color:var(--text-muted);text-transform:uppercase;text-align:left;padding:14px 16px;border-bottom:0.5px solid var(--border);background:var(--surface2);}
    td{font-size:12px;font-weight:300;color:var(--text);padding:13px 16px;border-bottom:0.5px solid rgba(201,151,58,0.06);}
    tr:last-child td{border-bottom:none;}
    tbody tr{cursor:pointer;transition:background 0.15s;}
    tbody tr:hover td{background:rgba(201,151,58,0.04);}
    .badge{display:inline-block;font-size:9px;font-weight:500;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:2px;}
    .badge-green{background:var(--green-bg);color:var(--green);}
    .badge-amber{background:var(--amber-bg);color:var(--amber);}
    .badge-red{background:var(--red-bg);color:var(--red);}
    .badge-blue{background:var(--blue-bg);color:var(--blue);}
    .table-footer{padding:12px 16px;font-size:11px;color:var(--text-muted);border-top:0.5px solid var(--border);display:flex;justify-content:space-between;}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;align-items:center;justify-content:center;padding:24px;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--surface);border:0.5px solid var(--border);border-radius:4px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;}
    .modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:0.5px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1;}
    .modal-title{font-size:13px;font-weight:500;letter-spacing:2px;color:var(--gold);text-transform:uppercase;}
    .modal-close{background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;padding:4px 8px;}
    .modal-body{padding:24px;}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
    .form-row.single{grid-template-columns:1fr;}
    .form-group{display:flex;flex-direction:column;gap:6px;}
    .form-label{font-size:9px;font-weight:500;letter-spacing:2px;color:var(--gold);text-transform:uppercase;}
    .form-input,.form-select,.form-textarea{background:var(--surface2);border:0.5px solid var(--border);border-radius:2px;padding:10px 12px;font-family:'Jost',sans-serif;font-size:13px;font-weight:300;color:var(--text);outline:none;transition:border-color 0.2s;}
    .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--border-h);}
    .form-input::placeholder,.form-textarea::placeholder{color:var(--text-muted);}
    .form-textarea{resize:vertical;min-height:72px;}
    .form-select option{background:var(--surface2);}
    .form-section{font-size:9px;font-weight:500;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;margin:20px 0 14px;padding-bottom:8px;border-bottom:0.5px solid var(--border);}
    .modal-footer{padding:16px 24px;border-top:0.5px solid var(--border);display:flex;gap:10px;justify-content:space-between;align-items:center;}
    .btn-cancelar{background:none;border:0.5px solid var(--border);border-radius:2px;padding:10px 20px;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:1px;color:var(--text-muted);cursor:pointer;}
    .btn-salvar{background:var(--gold);border:none;border-radius:2px;padding:10px 24px;font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:#080808;cursor:pointer;}
    .btn-salvar:hover{background:var(--gold-light);}
    .btn-excluir{background:none;border:0.5px solid var(--red-bg);border-radius:2px;padding:10px 16px;font-family:'Jost',sans-serif;font-size:11px;color:var(--red);cursor:pointer;}
    .btn-excluir:hover{background:var(--red-bg);}
    .toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:0.5px solid var(--gold);border-radius:4px;padding:14px 20px;font-size:12px;color:var(--gold);z-index:300;display:none;}
    .muted{color:var(--text-muted);font-size:12px;font-style:italic;padding:24px;text-align:center;}
    @media(max-width:900px){.sidebar{display:none;}.main{margin-left:0;}.form-row{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<header class="topbar">
  <div class="logo-area">
    <svg width="32" height="36" viewBox="0 0 60 68" fill="none"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8B6010"/><stop offset="45%" stop-color="#E8C070"/><stop offset="100%" stop-color="#8B6010"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E8C070"/><stop offset="100%" stop-color="#8B6010"/></linearGradient></defs><rect x="18" y="10" width="9" height="32" rx="1" fill="url(#g2)" opacity="0.85"/><rect x="31" y="2" width="9" height="40" rx="1" fill="url(#g2)"/><polygon points="0,20 10,20 30,58 50,20 60,20 30,68" fill="url(#g1)"/></svg>
    <div><div class="logo-name">VÉRTICE</div><div class="logo-sub">Imóveis</div></div>
  </div>
  <div class="topbar-right">
    <div><div class="user-name" id="user-name">—</div><div class="user-role">Vértice Imóveis</div></div>
    <div class="avatar" id="user-avatar">—</div>
    <button class="btn-sair" onclick="sair()">Sair</button>
  </div>
</header>
<nav class="sidebar">
  <div class="nav-section">Menu</div>
  <a class="nav-item" href="dashboard.html">▪ Dashboard</a>
  <a class="nav-item active" href="clientes.html">▪ Clientes</a>
  <a class="nav-item" href="empreendimentos.html">▪ Empreendimentos</a>
  <a class="nav-item" href="vendas.html">▪ Vendas</a>
  <div class="nav-section">Gestão</div>
  <a class="nav-item" href="financeiro.html">▪ Financeiro</a>
  <a class="nav-item" href="comissoes.html">▪ Comissões</a>
  <a class="nav-item" href="usuarios.html" id="menu-usuarios">▪ Usuários</a>
</nav>
<main class="main">
  <div class="page-header">
    <div class="page-title">Clientes</div>
    <button class="btn-novo" onclick="abrirModal()">+ Novo Cliente</button>
  </div>
  <div class="filtros">
    <div class="search-wrap"><input type="text" id="busca" placeholder="Buscar por nome, CPF ou e-mail..." oninput="filtrar()" /></div>
    <select class="filter-select" id="filtro-status" onchange="filtrar()"><option value="">Todos os status</option><option>Novo</option><option>Proposta</option><option>Ativo</option><option>Inativo</option></select>
    <select class="filter-select" id="filtro-corretor" onchange="filtrar()"><option value="">Todos os corretores</option></select>
  </div>
  <div class="card">
    <table>
      <thead><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>E-mail</th><th>Corretor</th><th>Interesse</th><th>Status</th></tr></thead>
      <tbody id="tabela-clientes"><tr><td colspan="7" class="muted">Carregando...</td></tr></tbody>
    </table>
    <div class="table-footer"><span id="total-clientes">—</span><span style="color:var(--gold);font-size:11px">Clique para editar</span></div>
  </div>
</main>
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title" id="modal-titulo">Novo Cliente</div><button class="modal-close" onclick="fecharModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-section">Dados pessoais</div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Nome completo *</label><input class="form-input" id="f-nome" type="text" placeholder="Ex: Carlos Mendes" /></div>
        <div class="form-group"><label class="form-label">CPF</label><input class="form-input" id="f-cpf" type="text" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this)" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">E-mail</label><input class="form-input" id="f-email" type="email" placeholder="email@exemplo.com" /></div>
        <div class="form-group"><label class="form-label">Telefone / WhatsApp *</label><input class="form-input" id="f-telefone" type="text" placeholder="(34) 99999-0000" maxlength="15" oninput="mascaraTelefone(this)" /></div>
      </div>
      <div class="form-row single"><div class="form-group"><label class="form-label">Endereço</label><input class="form-input" id="f-endereco" type="text" placeholder="Rua, número, bairro, cidade" /></div></div>
      <div class="form-section">Interesse de compra</div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Empreendimento</label><select class="form-select" id="f-empreendimento"><option value="">Selecione...</option></select></div>
        <div class="form-group"><label class="form-label">Corretor responsável</label><select class="form-select" id="f-corretor-modal"><option value="">Selecione...</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Status</label><select class="form-select" id="f-status"><option value="Novo">Novo</option><option value="Proposta">Proposta</option><option value="Ativo">Ativo</option><option value="Inativo">Inativo</option></select></div>
      </div>
      <div class="form-row single"><div class="form-group"><label class="form-label">Observações</label><textarea class="form-textarea" id="f-obs" placeholder="Anotações sobre o cliente..."></textarea></div></div>
    </div>
    <div class="modal-footer">
      <button class="btn-excluir" id="btn-excluir" onclick="excluirCliente()" style="display:none">Excluir</button>
      <div style="display:flex;gap:10px"><button class="btn-cancelar" onclick="fecharModal()">Cancelar</button><button class="btn-salvar" onclick="salvarCliente()">Salvar</button></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
  const SUPABASE_URL='https://hjmnamdetxltxygyvkja.supabase.co';
  const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqbW5hbWRldHhsdHh5Z3l2a2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTExMzgsImV4cCI6MjA5Mjg4NzEzOH0.41XQTIDzjO02L-obfgaKWdJzcTpL6zxPNJfZo3hgdnQ';
  const {createClient}=supabase; const db=createClient(SUPABASE_URL,SUPABASE_KEY);
  const sessao=sessionStorage.getItem('vertice_usuario'); if(!sessao) window.location.href='index.html';
  const usuario=JSON.parse(sessao);
  document.getElementById('user-name').textContent=usuario.nome;
  document.getElementById('user-avatar').textContent=usuario.nome.substring(0,2).toUpperCase();
  if(usuario.perfil!=='Administrador'){const m=document.getElementById('menu-usuarios');if(m)m.style.display='none';}
  function sair(){if(confirm('Deseja sair?')){sessionStorage.removeItem('vertice_usuario');window.location.href='index.html';}}
  let todosClientes=[]; let editandoId=null;
  const badgeMap={Ativo:'badge-green',Proposta:'badge-amber',Novo:'badge-blue',Inativo:'badge-red'};
  async function init(){
    const [{data:corretores},{data:emps}]=await Promise.all([
      db.from('usuarios').select('nome').eq('perfil','Corretor').eq('ativo',true),
      db.from('empreendimentos').select('nome')
    ]);
    const sc=document.getElementById('filtro-corretor'); const sc2=document.getElementById('f-corretor-modal');
    (corretores||[]).forEach(u=>{sc.innerHTML+=`<option>${u.nome}</option>`;sc2.innerHTML+=`<option>${u.nome}</option>`;});
    const se=document.getElementById('f-empreendimento');
    (emps||[]).forEach(e=>{se.innerHTML+=`<option>${e.nome}</option>`;});
    carregarClientes();
  }
  async function carregarClientes(){
    const{data}=await db.from('clientes').select('*').order('criado_em',{ascending:false});
    todosClientes=data||[]; filtrar();
  }
  function filtrar(){
    const b=document.getElementById('busca').value.toLowerCase();
    const s=document.getElementById('filtro-status').value;
    const c=document.getElementById('filtro-corretor').value;
    const lista=todosClientes.filter(x=>(!b||x.nome.toLowerCase().includes(b)||(x.cpf||'').includes(b)||(x.email||'').toLowerCase().includes(b))&&(!s||x.status===s)&&(!c||x.corretor===c));
    renderTabela(lista);
  }
  function renderTabela(lista){
    const tb=document.getElementById('tabela-clientes');
    document.getElementById('total-clientes').textContent=`${lista.length} cliente${lista.length!==1?'s':''}`;
    if(!lista.length){tb.innerHTML=`<tr><td colspan="7" class="muted">Nenhum cliente encontrado.</td></tr>`;return;}
    tb.innerHTML=lista.map(c=>`<tr onclick="editarCliente('${c.id}')"><td style="font-weight:400">${c.nome}</td><td>${c.cpf||'—'}</td><td>${c.telefone||'—'}</td><td style="color:var(--text-muted)">${c.email||'—'}</td><td>${c.corretor||'—'}</td><td style="color:var(--text-muted)">${c.empreendimento||'—'}</td><td><span class="badge ${badgeMap[c.status]||'badge-blue'}">${c.status}</span></td></tr>`).join('');
  }
  function abrirModal(c=null){
    editandoId=c?.id||null;
    document.getElementById('modal-titulo').textContent=c?'Editar Cliente':'Novo Cliente';
    document.getElementById('f-nome').value=c?.nome||'';
    document.getElementById('f-cpf').value=c?.cpf||'';
    document.getElementById('f-email').value=c?.email||'';
    document.getElementById('f-telefone').value=c?.telefone||'';
    document.getElementById('f-endereco').value=c?.endereco||'';
    document.getElementById('f-empreendimento').value=c?.empreendimento||'';
    document.getElementById('f-corretor-modal').value=c?.corretor||'';
    document.getElementById('f-status').value=c?.status||'Novo';
    document.getElementById('f-obs').value=c?.obs||'';
    document.getElementById('btn-excluir').style.display=c?'block':'none';
    document.getElementById('modal').classList.add('open');
  }
  function fecharModal(){document.getElementById('modal').classList.remove('open');editandoId=null;}
  function editarCliente(id){const c=todosClientes.find(x=>x.id===id);if(c)abrirModal(c);}
  async function salvarCliente(){
    const nome=document.getElementById('f-nome').value.trim();
    const tel=document.getElementById('f-telefone').value.trim();
    if(!nome||!tel){showToast('Preencha nome e telefone.',true);return;}
    const dados={nome,telefone:tel,cpf:document.getElementById('f-cpf').value.trim(),email:document.getElementById('f-email').value.trim(),endereco:document.getElementById('f-endereco').value.trim(),empreendimento:document.getElementById('f-empreendimento').value,corretor:document.getElementById('f-corretor-modal').value,status:document.getElementById('f-status').value,obs:document.getElementById('f-obs').value.trim()};
    if(editandoId){const{error}=await db.from('clientes').update(dados).eq('id',editandoId);if(error){showToast('Erro ao atualizar.',true);return;}showToast('Cliente atualizado!');}
    else{const{error}=await db.from('clientes').insert(dados);if(error){showToast('Erro ao cadastrar.',true);return;}showToast('Cliente cadastrado!');}
    fecharModal();carregarClientes();
  }
  async function excluirCliente(){
    if(!confirm('Excluir este cliente?'))return;
    const{error}=await db.from('clientes').delete().eq('id',editandoId);
    if(error){showToast('Erro ao excluir.',true);return;}
    showToast('Cliente excluído.');fecharModal();carregarClientes();
  }
  function mascaraCPF(i){let v=i.value.replace(/\D/g,'').substring(0,11);v=v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');i.value=v;}
  function mascaraTelefone(i){let v=i.value.replace(/\D/g,'').substring(0,11);if(v.length>10)v=v.replace(/^(\d{2})(\d{5})(\d{4})$/,'($1) $2-$3');else if(v.length>6)v=v.replace(/^(\d{2})(\d{4})(\d{0,4})$/,'($1) $2-$3');else if(v.length>2)v=v.replace(/^(\d{2})(\d{0,5})$/,'($1) $2');i.value=v;}
  function showToast(msg,erro=false){const t=document.getElementById('toast');t.textContent=msg;t.style.color=erro?'#e05050':'var(--gold)';t.style.borderColor=erro?'rgba(224,80,80,0.4)':'var(--border-h)';t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
  document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))fecharModal();});
  init();
</script>
</body>
</html>
